<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Nevian | Something great is coming</title>
    <meta name="description" content="Something great is coming." />
    <link rel="canonical" href="https://nevian.info/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nevian" />
    <meta property="og:title" content="Nevian | Something great is coming" />
    <meta property="og:description" content="Something great is coming." />
    <meta property="og:url" content="https://nevian.info/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/assets/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@800&family=Inter:wght@400&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #f5f7f6; }
      body {
        display: flex;
        flex-direction: column;
        padding: 24px;
        box-sizing: border-box;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        animation: appear 1.6s cubic-bezier(0.2, 0.7, 0.25, 1) both;
      }
      main img { width: 48px; height: 48px; object-fit: contain; }
      h1 {
        margin: 28px 0 0;
        font-family: "Hanken Grotesk", Inter, sans-serif;
        font-weight: 800;
        font-size: clamp(36px, 6vw, 80px);
        line-height: 1.05;
        letter-spacing: -0.035em;
      }
      p {
        margin: 18px 0 0;
        max-width: 460px;
        color: #9aa3a0;
        font-size: clamp(15px, 1.4vw, 18px);
        line-height: 1.6;
      }
      footer {
        text-align: center;
        color: #5f6764;
        font-size: 13px;
        animation: appear 1.6s cubic-bezier(0.2, 0.7, 0.25, 1) 0.4s both;
      }
      @keyframes appear {
        from { opacity: 0; transform: translateY(12px); filter: blur(10px); }
        to { opacity: 1; transform: none; filter: blur(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        main, footer { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/logo.png" alt="Nevian" />
      <h1>Something great is coming.</h1>
      <p>We're putting the finishing touches on something new. Check back soon.</p>
    </main>
    <footer>&copy; 2026 Nevian</footer>
  </body>
</html>
